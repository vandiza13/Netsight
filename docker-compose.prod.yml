version: '3.8'

services:
  app:
    build:
      context: .
      target: final
    image: netsight-app:prod
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - .env.prod
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
      - ./storage/app/geoip:/var/www/html/storage/app/geoip:ro # Mount MMDB locally
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - netsight
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_DB=netsight
      - POSTGRES_USER=netsight
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - netsight
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6-alpine
    restart: always
    command: redis-server --requirepass-file /run/secrets/redis_password
    ports:
      - "6379:6379" # Exposed for tenant containers connecting via host IP (protected by requirepass)
    volumes:
      - redisdata:/data
    networks:
      - netsight
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  horizon:
    image: netsight-app:prod
    restart: always
    command: php artisan horizon
    env_file:
      - .env.prod
    depends_on:
      - app
      - redis
    networks:
      - netsight
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  mongodb:
    image: mongo:6
    restart: always
    command: --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongodata:/data/db
    networks:
      - netsight
    deploy:
      resources:
        limits:
          memory: 256M

  genieacs:
    image: drumsergio/genieacs:1.2.9
    restart: always
    depends_on:
      - mongodb
    expose:
      - "7547"
      - "7557"
      - "7548"
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://mongodb:27017/genieacs
      - GENIEACS_EXT_DIR=/opt/genieacs/ext
      - GENIEACS_UI_JWT_SECRET=netsight_genieacs_secret_key
      - GENIEACS_CWMP_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-cwmp-access.log
      - GENIEACS_NBI_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-nbi-access.log
      - GENIEACS_FS_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-fs-access.log
    volumes:
      - genieacs_ext:/opt/genieacs/ext
      - genieacs_logs:/var/log/genieacs
    networks:
      - netsight
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "9090:9090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - netsight

  # Phase 6: Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - netsight

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password
    depends_on:
      - prometheus
    networks:
      - netsight
    secrets:
      - grafana_password

secrets:
  db_password:
    file: ./docker/secrets/db_password
  redis_password:
    file: ./docker/secrets/redis_password
  app_key:
    file: ./docker/secrets/app_key
  grafana_password:
    file: ./docker/secrets/grafana_password

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  mongodata:
  genieacs_ext:
  genieacs_logs:

networks:
  netsight:
    driver: bridge
