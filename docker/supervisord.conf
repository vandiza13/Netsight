; =============================================================================
; NETSIGHT v2.1 - Supervisord Configuration
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ---------------------------------------------------------------------------
; PHP-FPM (primary process)
; ---------------------------------------------------------------------------
[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Laravel Horizon
; ---------------------------------------------------------------------------
[program:horizon]
command=php /var/www/html/artisan horizon
autostart=true
autorestart=true
priority=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/horizon.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=3600

; ---------------------------------------------------------------------------
; Task Scheduler (CLI Loop)
; ---------------------------------------------------------------------------
[program:scheduler]
command=sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction & sleep 60; done"
autostart=true
autorestart=true
priority=15
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
