; =============================================================================
; NETSIGHT v2.1 - Supervisord Configuration
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ---------------------------------------------------------------------------
; PHP-FPM (primary process)
; ---------------------------------------------------------------------------
[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Laravel Horizon (optional — set autostart=true for dev, false for production
; when running Horizon as a separate container via docker-compose)
; ---------------------------------------------------------------------------
[program:horizon]
command=php /var/www/html/artisan horizon
autostart=false
autorestart=true
priority=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/horizon.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=3600
