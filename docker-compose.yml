# =============================================================================
# NETSIGHT v2.1 - Docker Compose (Optimized for Milestone 1 Testing)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application (PHP-FPM + Supervisord)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    container_name: netsight-app
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./public:/var/www/html/public
      - geoip_data:/var/www/html/storage/app/geoip
    networks:
      - netsight
    secrets:
      - db_password
      - redis_password
      - app_key
    # 🔒 Batasi RAM Biar Gak Rakus
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: netsight-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: netsight
      POSTGRES_USER: netsight
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - netsight
    secrets:
      - db_password
    # 🔒 Batasi RAM Shared Buffers Postgres Docker
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis Cache / Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: netsight-redis
    restart: unless-stopped
    command: sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes'
    volumes:
      - redisdata:/data
    networks:
      - netsight
    secrets:
      - redis_password
    # 🔒 Batasi RAM Redis (Cache ringan)
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Caddy Reverse Proxy / Web Server
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: netsight-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/var/www/html/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - netsight
    # 🔒 Caddy bawaan sangat ringan, batasi kecil saja
    deploy:
      resources:
        limits:
          memory: 128M



# =============================================================================
# Secrets
# =============================================================================
secrets:
  db_password:
    file: ./docker/secrets/db_password
  redis_password:
    file: ./docker/secrets/redis_password
  app_key:
    file: ./docker/secrets/app_key

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  geoip_data:

# =============================================================================
# Networks
# =============================================================================
networks:
  netsight:
    driver: bridge