name: Deploy Netsight to VPS

on:
  push:
    branches:
      - main # Jalankan deployment otomatis setiap kali ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Files to VPS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "app,artisan,bootstrap,composer.json,composer.lock,config,database,docker,docker-compose.yml,package.json,package-lock.json,public,resources,routes,vite.config.js,tsconfig.json,Dockerfile,Caddyfile,.env.example"
          target: "/var/www/netsight"
          rm: false # Jangan hapus file yang sudah ada (seperti .env)
          tar_tmp_path: "/tmp"
          debug: true

      - name: Execute Deployment Commands on VPS (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/netsight
            
            # 1. Siapkan file .env jika belum ada
            if [ ! -f .env ]; then
              cp .env.example .env
              NEED_KEY_GEN=true
            else
              NEED_KEY_GEN=false
            fi
            
            # Siapkan file docker secrets jika belum ada
            mkdir -p docker/secrets
            if [ ! -f docker/secrets/db_password ]; then
              cp docker/secrets/db_password.example docker/secrets/db_password
            fi
            if [ ! -f docker/secrets/redis_password ]; then
              cp docker/secrets/redis_password.example docker/secrets/redis_password
            fi
            if [ ! -f docker/secrets/app_key ]; then
              cp docker/secrets/app_key.example docker/secrets/app_key
            fi
            
            # 2. Build & Jalankan Container
            docker compose up -d --build
            
            # 3. Generate APP_KEY jika baru dibuat
            if [ "$NEED_KEY_GEN" = true ]; then
              docker compose exec -T app php artisan key:generate
            fi
            
            # 4. Jalankan Migrasi Database di dalam Container
            docker compose exec -T app php artisan migrate --force
            
            # 5. Bersihkan Cache Laravel
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            
            echo "Deployment Sukses! 🚀"
