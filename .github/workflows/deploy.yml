name: Deploy Netsight

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment to Deploy'
        required: true
        default: 'demo'
        type: choice
        options:
          - demo
          - production

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Compress Source Code
        run: tar -czf netsight.tar.gz --exclude=.git --exclude=node_modules --exclude=netsight.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netsight-build
          path: netsight.tar.gz

  deploy-demo:
    name: Deploy to VPS A (Demo)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'demo')
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: netsight-build

      - name: Deploy to VPS A
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/netsight-demo
            
      - name: Copy Tarball to VPS A
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "netsight.tar.gz"
          target: "/var/www/netsight-demo"

      - name: Extract & Start VPS A Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/netsight-demo
            tar -xzf netsight.tar.gz
            rm netsight.tar.gz
            docker compose up -d --build
            docker compose exec -T app php artisan db:seed --class=DemoDataSeeder --force

  deploy-production:
    name: Deploy to VPS B (Production)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: netsight-build

      - name: Deploy to VPS B Master Folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USERNAME_PROD }}
          key: ${{ secrets.VPS_SSH_KEY_PROD }}
          script: |
            mkdir -p /var/www/netsight-saas/master
            
      - name: Copy Tarball to VPS B
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USERNAME_PROD }}
          key: ${{ secrets.VPS_SSH_KEY_PROD }}
          source: "netsight.tar.gz"
          target: "/var/www/netsight-saas/master"

      - name: Extract & Rolling Update Tenants
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USERNAME_PROD }}
          key: ${{ secrets.VPS_SSH_KEY_PROD }}
          script: |
            cd /var/www/netsight-saas/master
            tar -xzf netsight.tar.gz
            rm netsight.tar.gz
            
            # Build new master image
            docker build -t netsight-app:latest .
            
            # Looping to update all tenants
            for tenant_dir in /var/www/netsight-saas/tenants/*; do
              if [ -d "$tenant_dir" ] && [ -f "$tenant_dir/docker-compose.yml" ]; then
                echo "Updating tenant in $tenant_dir"
                cd "$tenant_dir"
                docker compose up -d --force-recreate
              fi
            done
