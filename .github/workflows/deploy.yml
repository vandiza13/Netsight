name: Deploy Netsight

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment to Deploy'
        required: true
        default: 'demo'
        type: choice
        options:
          - demo
          - production
          - onpremise

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Netsight Core
        uses: actions/checkout@v4
        with:
          repository: vandiza13/Netsight-core
          path: packages/vandiza/netsight-core
          token: ${{ secrets.NETSIGHT_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Compress Source Code
        run: |
          tar -czf ../netsight.tar.gz --exclude=.git --exclude=node_modules .
          mv ../netsight.tar.gz ./netsight.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netsight-build
          path: netsight.tar.gz

  deploy-demo:
    name: Deploy to VPS A (Demo)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'demo')
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: netsight-build

      - name: Deploy to VPS A
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Directory should already be owned by the SSH user
            
      - name: Copy Tarball to VPS A
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "netsight.tar.gz"
          target: "/var/www/netsight"

      - name: Extract & Start VPS A Services
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.NETSIGHT_CORE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            cd /var/www/netsight
            mkdir -p /tmp/netsight_temp
            tar -xzf netsight.tar.gz -C /tmp/netsight_temp
            rsync -a --delete --exclude='.env*' --exclude='storage/' --exclude='docker/secrets/' --exclude='netsight.tar.gz' /tmp/netsight_temp/ ./
            rm -rf /tmp/netsight_temp netsight.tar.gz
            export GITHUB_TOKEN=$GITHUB_TOKEN
            docker compose up -d --build
            echo "Waiting for database to be ready..."
            for i in {1..15}; do docker compose exec -T db pg_isready -U netsight 2>/dev/null && break || sleep 2; done
            docker compose exec -T app mkdir -p /var/www/html/storage/framework/views /var/www/html/storage/framework/cache/data /var/www/html/storage/framework/sessions /var/www/html/storage/logs
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan queue:restart
            docker compose exec -T app php artisan db:seed --class=DemoDataSeeder --force
            docker compose exec -T app php artisan app:warm-demo-sandboxes > /dev/null 2>&1 &

  deploy-production:
    name: Deploy to VPS B (Production)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: netsight-build

      - name: Deploy to VPS B Master Folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USERNAME_PROD }}
          key: ${{ secrets.VPS_SSH_KEY_PROD }}
          script: |
            mkdir -p /var/www/netsight-saas/master
            
      - name: Copy Tarball to VPS B
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USERNAME_PROD }}
          key: ${{ secrets.VPS_SSH_KEY_PROD }}
          source: "netsight.tar.gz"
          target: "/var/www/netsight-saas/master"

      - name: Extract & Rolling Update Tenants
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.NETSIGHT_CORE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USERNAME_PROD }}
          key: ${{ secrets.VPS_SSH_KEY_PROD }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            cd /var/www/netsight-saas/master
            mkdir -p /tmp/netsight_temp
            tar -xzf netsight.tar.gz -C /tmp/netsight_temp
            rsync -a --delete --exclude='.env*' --exclude='storage/' --exclude='docker/secrets/' --exclude='netsight.tar.gz' /tmp/netsight_temp/ ./
            rm -rf /tmp/netsight_temp netsight.tar.gz
            
            # Build new master image (tag as latest and prod to match tenant configurations)
            docker build --build-arg GITHUB_TOKEN=$GITHUB_TOKEN -t netsight-app:latest -t netsight-app:prod .
            
            for tenant_dir in /var/www/netsight-saas/tenants/*; do
              if [ -d "$tenant_dir" ] && [ -f "$tenant_dir/docker-compose.yml" ]; then
                echo "Updating tenant in $tenant_dir"
                cd "$tenant_dir"
                # Force delete public folder using docker to bypass any host permission/ownership issues
                docker run --rm -v "$tenant_dir:/mnt" alpine rm -rf /mnt/public
                cp -r /var/www/netsight-saas/master/public "$tenant_dir/"
                chmod -R 755 "$tenant_dir/public"
                docker compose up -d --force-recreate
                echo "Menunggu container aplikasi siap..."
                sleep 5
                docker compose exec -T app mkdir -p /var/www/html/storage/framework/views /var/www/html/storage/framework/cache/data /var/www/html/storage/framework/sessions /var/www/html/storage/logs
                docker compose exec -T app php artisan migrate --force
                docker compose exec -T app php artisan queue:restart
                docker compose exec -T app php artisan config:cache
                docker compose exec -T app php artisan route:cache
                docker compose exec -T app php artisan view:cache
                docker compose exec -T app chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
              fi
            done

  build-onpremise-release:
    name: Build & Deploy On-Premise Installer
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'onpremise'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Netsight Core
        uses: actions/checkout@v4
        with:
          repository: vandiza13/Netsight-core
          path: packages/vandiza/netsight-core
          token: ${{ secrets.NETSIGHT_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install yakpro-po (PHP Obfuscator)
        run: |
          git clone https://github.com/pk-fr/yakpro-po.git /tmp/yakpro-po
          cd /tmp/yakpro-po
          git clone https://github.com/nikic/PHP-Parser.git
          sudo ln -s /tmp/yakpro-po/yakpro-po.php /usr/local/bin/yakpro-po
          chmod +x /tmp/yakpro-po/yakpro-po.php

      - name: Obfuscate netsight-core
        run: |
          mkdir /tmp/obfuscated_src
          yakpro-po packages/vandiza/netsight-core/src -o /tmp/obfuscated_src
          rm -rf packages/vandiza/netsight-core/src
          
          # yakpro-po pathing can be highly unpredictable depending on the environment.
          # We search for a known inner directory ('Jobs') to guarantee we find the root of the obfuscated src.
          JOBS_DIR=$(find /tmp/obfuscated_src -type d -name "Jobs" | head -n 1)
          SRC_DIR=$(dirname "$JOBS_DIR")
          mv "$SRC_DIR" packages/vandiza/netsight-core/src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Compress Source Code
        run: |
          tar -czf ../netsight-onpremise-latest.tar.gz --exclude=.git --exclude=node_modules --exclude=vendor --exclude=docker-compose.yml .
          mv ../netsight-onpremise-latest.tar.gz ./netsight-onpremise-latest.tar.gz

      - name: Prepare Directory on VPS A
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/install-netsight
            sudo chown -R $USER:$USER /var/www/install-netsight

      - name: Deploy Installer to VPS A
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "netsight-onpremise-latest.tar.gz,install.sh"
          target: "/var/www/install-netsight"
