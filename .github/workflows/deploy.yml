name: Deploy Netsight to VPS

on:
  push:
    branches:
      - main # Jalankan deployment otomatis setiap kali ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Deploy via Native SSH/SCP
        run: |
          # 1. Setup SSH Key
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Tar files locally (kecil dan cepat)
          tar -zcf /tmp/netsight.tar.gz app artisan bootstrap composer.json composer.lock config database docker docker-compose.yml package.json package-lock.json public resources routes storage vite.config.js Dockerfile Caddyfile .env.example phpunit.xml
          
          # 3. Kirim tarball ke folder /tmp VPS
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -P 22 /tmp/netsight.tar.gz ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/tmp/netsight.tar.gz
          
          # 4. SSH ke VPS, Ekstrak, dan Jalankan Docker
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p 22 ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} '
            cd /var/www/netsight
            
            # Ekstrak file tarball
            tar -zxf /tmp/netsight.tar.gz -C /var/www/netsight
            rm /tmp/netsight.tar.gz
            
            # Siapkan file .env jika belum ada
            if [ ! -f .env ]; then
              cp .env.example .env
              NEED_KEY_GEN=true
            else
              NEED_KEY_GEN=false
            fi
            
            # Siapkan file docker secrets jika belum ada
            mkdir -p docker/secrets
            if [ ! -f docker/secrets/db_password ]; then
              cp docker/secrets/db_password.example docker/secrets/db_password
            fi
            if [ ! -f docker/secrets/redis_password ]; then
              cp docker/secrets/redis_password.example docker/secrets/redis_password
            fi
            if [ ! -f docker/secrets/app_key ]; then
              cp docker/secrets/app_key.example docker/secrets/app_key
            fi
            
            # Build & Jalankan Container
            docker compose up -d --build
            
            # Generate APP_KEY jika baru dibuat
            if [ "$NEED_KEY_GEN" = true ]; then
              docker compose exec -T app php artisan key:generate
            fi
            
            # Jalankan Migrasi Database di dalam Container
            docker compose exec -T app php artisan migrate --force
            
            # Bersihkan Cache Laravel
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            
            echo "Deployment Sukses! 🚀"
          '
